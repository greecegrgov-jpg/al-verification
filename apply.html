<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>e-Visa - Apply</title>

    <link rel="stylesheet" href="./img/app.3147fd8c.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            color: #1f2937;
        }

        .navbar {
            background: #12345b;
            padding: 12px 20px;
        }

        .navbar-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 220px;
            height: auto;
        }

        .nav-back {
            margin-left: auto;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .page {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-title {
            background: #12345b;
            color: white;
            padding: 18px 22px;
            border-radius: 6px 6px 0 0;
        }

        .page-title h1 {
            margin: 0;
            font-size: 28px;
        }

        .form-card {
            background: white;
            padding: 25px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            border-radius: 0 0 6px 6px;
        }

        .section-title {
            color: #12345b;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
            margin: 10px 0 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .required {
            color: #d00;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37,99,235,.12);
        }

        .notice {
            background: #eef6ff;
            border-left: 4px solid #2563eb;
            padding: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            border: none;
            border-radius: 5px;
            padding: 13px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            background: #0f6b9a;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .footer {
            margin-top: 40px;
            background: #12345b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .logo {
                width: 180px;
            }

            .page-title h1 {
                font-size: 23px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="navbar-inner">

        <a href="./index.html">
            <img src="./img/main.png" class="logo" alt="e-Visa">
        </a>

        <a href="./index.html" class="nav-back">
            ← Back to Home
        </a>

    </div>
</nav>

<main class="page">

    <div class="page-title">
        <h1>e-Visa Application</h1>
    </div>

    <div class="form-card">

        <div class="notice">
            Please complete all required information carefully.
            Make sure that the information entered matches your passport.
        </div>

        <form id="visaApplicationForm">

            <h2 class="section-title">Personal Information</h2>

            <div class="form-grid">

                <div class="field">
                    <label>First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" required>
                </div>

                <div class="field">
                    <label>Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" required>
                </div>

                <div class="field">
                    <label>Date of Birth <span class="required">*</span></label>
                    <input type="date" id="dateOfBirth" required>
                </div>

                <div class="field">
                    <label>Gender <span class="required">*</span></label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="field">
                    <label>Nationality <span class="required">*</span></label>
                    <input type="text" id="nationality" placeholder="e.g. Pakistan" required>
                </div>

            </div>

            <h2 class="section-title">Passport Information</h2>

            <div class="form-grid">

                <div class="field">
                    <label>Passport Number <span class="required">*</span></label>
                    <input type="text" id="passportNumber" required>
                </div>

                <div class="field">
                    <label>Passport Expiry Date <span class="required">*</span></label>
                    <input type="date" id="passportExpiry" required>
                </div>

            </div>

            <h2 class="section-title">Visa Information</h2>

            <div class="form-grid">

                <div class="field">
                    <label>Visa Type <span class="required">*</span></label>

                    <select id="visaType" required>
                        <option value="">Select Visa Type</option>
                        <option value="Tourism">Tourism</option>
                        <option value="Business">Business</option>
                        <option value="Study">Study</option>
                        <option value="Transit">Transit</option>
                    </select>
                </div>

                <div class="field">
                    <label>Purpose of Travel <span class="required">*</span></label>

                    <input
                        type="text"
                        id="travelPurpose"
                        placeholder="Purpose of travel"
                        required
                    >
                </div>

                <div class="field">
                    <label>Intended Arrival Date <span class="required">*</span></label>
                    <input type="date" id="arrivalDate" required>
                </div>

                <div class="field">
                    <label>Intended Departure Date <span class="required">*</span></label>
                    <input type="date" id="departureDate" required>
                </div>

            </div>

            <h2 class="section-title">Contact Information</h2>

            <div class="form-grid">

                <div class="field">
                    <label>Email Address <span class="required">*</span></label>
                    <input type="email" id="email" required>
                </div>

                <div class="field">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" required>
                </div>

                <div class="field full">
                    <label>Address <span class="required">*</span></label>
                    <input type="text" id="address" required>
                </div>

            </div>

            <div class="actions">

                <button
                    type="reset"
                    class="btn btn-secondary">
                    Clear
                </button>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Submit Application
                </button>

            </div>

        </form>

    </div>

</main>

<footer class="footer">
    <p>e-Visa Application System</p>
</footer>

<script>
document.getElementById("visaApplicationForm").addEventListener("submit", function(event) {
    event.preventDefault();

    alert("Application form submitted. Database connection will be added in the next step.");
});
</script>

</body>
</html>
